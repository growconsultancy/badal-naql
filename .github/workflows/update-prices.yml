name: Update fuel prices

# Lebanon publishes new fuel schedules (usually Tuesday and Friday mornings).
# This checks several times a day, adds any new 95 octane price to prices.json,
# commits it, and asks GitHub Pages to rebuild the site.

on:
  schedule:
    - cron: "10 5,7,9,11,14,17 * * *"   # UTC (Beirut = UTC+2/+3)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest 95 octane price
        run: |
          cat > /tmp/update_prices.py <<'PY'
          import json, re, sys, urllib.request, urllib.parse

          # Full-content feed of the latest posts (search results lag and summaries get cut off).
          FEEDS = ["https://www.albahaasite.com/feeds/posts/default?alt=json&max-results=150",
                   "https://www.albahaasite.com/feeds/posts/default/-/%D8%AC%D8%AF%D9%8A%D8%AF?alt=json&max-results=60"]
          AR_DIGITS = str.maketrans("٠١٢٣٤٥٦٧٨٩", "0123456789")
          PRICE_RE = re.compile(r"95\s*(?:أوكتان|اوكتان|أوكتين|octane)\s*[:：]?\s*([0-9٠-٩][0-9٠-٩,\.٬ ]{5,12})", re.I)

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (badal-naql price updater)"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r).get("feed", {}).get("entry", [])

          def to_int(s):
              s = s.translate(AR_DIGITS)
              d = re.sub(r"[^0-9]", "", s)
              return int(d) if d else None

          prices = json.load(open("prices.json", encoding="utf-8"))
          known = {p["date"] for p in prices}
          last = max(prices, key=lambda p: p["date"])

          found = {}
          for feed in FEEDS:
              try:
                  entries = fetch(feed)
              except Exception as e:
                  print("feed error:", feed, e)
                  continue
              for e in entries:
                  title = e.get("title", {}).get("$t", "")
                  body = e.get("content", {}).get("$t", "") or e.get("summary", {}).get("$t", "")
                  body = re.sub(r"<[^>]+>", " ", body).replace("&nbsp;", " ")
                  text = title + " " + body
                  if "محروقات" not in text and "بنزين" not in text:
                      continue
                  m = PRICE_RE.search(text)
                  if not m:
                      continue
                  price = to_int(m.group(1))
                  if not price or not (500_000 <= price <= 20_000_000):
                      continue
                  date = e["published"]["$t"][:10]   # local Beirut date
                  link = next((l["href"] for l in e.get("link", []) if l.get("rel") == "alternate"), "")
                  found.setdefault(date, {"price": price, "url": link})

          added = []
          prev = last["price95"]
          for date in sorted(found):
              if date in known or date <= last["date"]:
                  continue
              price = found[date]["price"]
              if abs(price - prev) > prev * 0.25:   # reject implausible jumps
                  print("skipped implausible", date, price)
                  continue
              prices.append({"date": date, "price95": price, "change": price - prev,
                             "source": "Al Bahaa", "url": found[date]["url"], "derived": False})
              added.append(date)
              prev = price

          if not added:
              print("No new price schedule.")
              sys.exit(0)
          prices.sort(key=lambda p: p["date"])
          with open("prices.json", "w", encoding="utf-8") as f:
              json.dump(prices, f, ensure_ascii=False, indent=1)
              f.write("\n")
          print("Added:", ", ".join(added))
          PY
          python3 /tmp/update_prices.py

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet prices.json; then
            echo "Nothing to commit."
            exit 0
          fi
          latest=$(python3 -c "import json;print(max(p['date'] for p in json.load(open('prices.json'))))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "Update fuel prices to $latest"
          git push
          # Pushes made with the workflow token don't always start a Pages build, so request one.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
